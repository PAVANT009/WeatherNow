# WeatherNow – Docker Compose
# Stage 1: PostgreSQL only. Backend and frontend run locally.

services:
  db:
    image: postgres:16-alpine
    container_name: weathernow-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weathernow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathernow}
      POSTGRES_DB: ${POSTGRES_DB:-weathernow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weathernow} -d ${POSTGRES_DB:-weathernow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
