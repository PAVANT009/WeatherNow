# Alembic config will be fully configured in Stage 2 (database models).
# Kept here so the backend layout matches the planned project structure.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden at runtime by alembic/env.py from Settings.database_url
sqlalchemy.url = postgresql+psycopg://weathernow:weathernow@localhost:5432/weathernow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
